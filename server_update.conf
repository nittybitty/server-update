# Configuration for server_update.bash

# Timeout for the update *check* phase in seconds
DNF_TIMEOUT=600

# Timeout for actually *applying* updates in seconds (Phase 3/4).
# Kept separate from DNF_TIMEOUT: big updates on slow hardware routinely
# exceed 10 minutes, and killing a package transaction mid-flight risks
# rpmdb/dpkg corruption.
APPLY_TIMEOUT=3600

# Regex to detect kernel packages in dnf output
KERNEL_PACKAGE_REGEX="^kernel(-core|-modules)?\b"

# Regex to detect kernel updates in dnf output
KERNEL_UPDATE_REGEX="(Installing|Upgrading).*(kernel-core|kernel-modules|kernel)\b"

# Maximum time to wait for a server to reboot in seconds
REBOOT_MAX_WAIT=900

# Interval between reboot checks in seconds
REBOOT_WAIT_INTERVAL=30
